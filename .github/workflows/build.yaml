name: Build Meeqat

on:
  push:
    branches: [main, beta]
    paths-ignore:
      - 'README.md'
      - 'screenshots/**'
      - 'Compose-Material-3-Expressive-Catalog/**'
      - 'plan.md'
  pull_request:
    branches: [main, beta]
    paths-ignore:
      - 'README.md'
      - 'screenshots/**'
      - 'Compose-Material-3-Expressive-Catalog/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Force build type'
        required: false
        default: 'auto'
        type: choice
        options: [auto, preview, release]

concurrency:
  group: meeqat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  pull-requests: write

env:
  GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dkotlin.daemon.jvm.options=-Xmx3g
  JAVA_OPTS: -Xmx4g
  KOTLIN_DAEMON_JVM_OPTIONS: -Xmx3g
  BASE_VERSION: "1.0.0"
  STABLE_BUILD: "1"
  BETA_CODE_OFFSET: "100000"
  RELEASE_TAGLINE: "Noor"
  PROJECT_DIR: "MeeqatApp"

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      apk_path: ${{ steps.findapk.outputs.apk }}
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
      display_version: ${{ steps.version.outputs.display }}
      release_tag: ${{ steps.version.outputs.tag }}
      title_suffix: ${{ steps.version.outputs.suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept SDK licenses & install platforms
        run: |
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)
          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" || "$SDKMANAGER" "build-tools;36.0.0"

      - name: Cache Gradle wrapper & dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VN="${GITHUB_REF#refs/tags/v}"
            CODE="$((1 + ${{ github.run_number }}))"
            TAG="${{ github.ref_name }}"
            DISPLAY="${VN}+${CODE}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            VN="$BASE_VERSION"
            CODE="$STABLE_BUILD"
            TAG="v${VN}+${CODE}"
            DISPLAY="${VN}+${CODE}"
            if [[ "$DISPLAY" == "1.0.0+1" ]]; then SUFFIX=" — First Release"; else SUFFIX=""; fi
          else
            VN="${BASE_VERSION}-dev(#${{ github.run_number }})"
            CODE="$(($BETA_CODE_OFFSET + ${{ github.run_number }}))"
            TAG=""
            DISPLAY="$VN"
          fi
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "display=$DISPLAY" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "suffix=${SUFFIX:-}" >> "$GITHUB_OUTPUT"
          echo "MEEQAT_VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "MEEQAT_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Version: $VN+$CODE (tag $TAG)"

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "→ Decoding keystore from secrets.KEYSTORE_BASE64"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/app/release.keystore"
            echo "KEYSTORE_PATH=$PROJECT_DIR/app/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "→ No secrets.KEYSTORE_BASE64 — generating ephemeral preview keystore"
            keytool -genkeypair -v \
              -keystore "$PROJECT_DIR/app/release.keystore" \
              -storepass meeqat123 \
              -alias meeqat \
              -keypass meeqat123 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Meeqat Preview, OU=CI, O=Meeqat, L=Makkah, S=Makkah, C=SA"
            echo "KEYSTORE_PATH=$PROJECT_DIR/app/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=meeqat123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=meeqat" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=meeqat123" >> "$GITHUB_ENV"
          fi
          ls -lh "$PROJECT_DIR/app/release.keystore"

      - name: Clear KSP cache
        run: |
          rm -rf ~/.gradle/caches/modules-2/files-2.1/com.google.devtools.ksp || true
          rm -rf "$PROJECT_DIR/.gradle/" || true
          rm -rf .gradle/ || true
          echo "Cleared KSP cache"

      - name: Clean build cache
        run: |
          rm -rf ~/.gradle/caches/build-cache-1
          rm -rf ~/.gradle/caches/modules-2 || true
          echo "Cleaned build caches"

      - name: Build signed assembleRelease
        run: |
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleRelease --stacktrace --info --no-build-cache --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" -Dkotlin.daemon.jvmargs="-Xmx3g"
          echo "Build finished, APKs:"
          find app/build -name "*.apk" -type f -exec ls -lh {} \;

      - name: Find APK paths (per-ABI splits)
        id: findapk
        run: |
          if ! ls "$PROJECT_DIR/app/build/outputs/apk/release/"*.apk >/dev/null 2>&1; then
            echo "No APKs found!"
            find "$PROJECT_DIR/app/build" -type f | head -n 100
            exit 1
          fi
          VN="${{ steps.version.outputs.name }}"
          SAFE=$(echo "$VN" | tr -d '(#)' | tr ' ' '-')
          FRIENDLY=""
          FIRST=""
          for APK in "$PROJECT_DIR/app/build/outputs/apk/release/"*.apk; do
            case "$APK" in
              *arm64-v8a*) ABI="arm64" ;;
              *armeabi-v7a*) ABI="armv7" ;;
              *) ABI="universal" ;;
            esac
            OUT="$PROJECT_DIR/Meeqat-${SAFE}-${ABI}.apk"
            cp "$APK" "$OUT"
            sha256sum "$OUT" > "$OUT.sha256"
            cat "$OUT.sha256"
            FRIENDLY="$FRIENDLY $OUT"
            if [[ -z "$FIRST" ]]; then FIRST="$APK"; fi
          done
          echo "apk=$FIRST" >> "$GITHUB_OUTPUT"
          echo "friendly=$FRIENDLY" >> "$GITHUB_OUTPUT"
          ls -lh "$PROJECT_DIR"/Meeqat-*.apk*

      - name: Upload preview artifact (beta) — auto-expires
        if: github.ref == 'refs/heads/beta' || (github.event_name == 'pull_request' && github.base_ref == 'beta')
        uses: actions/upload-artifact@v4
        with:
          name: Meeqat-preview-${{ steps.version.outputs.name }}-build${{ github.run_number }}
          path: |
            MeeqatApp/Meeqat-*.apk
            MeeqatApp/Meeqat-*.apk.sha256
          retention-days: 7
          if-no-files-found: error
          overwrite: true

      - name: Upload release artifact (main)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Meeqat-release-${{ steps.version.outputs.name }}
          path: |
            MeeqatApp/Meeqat-*.apk
            MeeqatApp/Meeqat-*.apk.sha256
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      - name: Upload artifact for PRs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Meeqat-PR-${{ github.event.number }}-${{ steps.version.outputs.name }}
          path: |
            MeeqatApp/Meeqat-*.apk
            MeeqatApp/Meeqat-*.apk.sha256
          retention-days: 7

      - name: Upload build directory (auto-expire)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: MeeqatApp/app/build
          retention-days: 7
          if-no-files-found: warn

  preview-release:
    name: Publish beta preview (auto-replace)
    needs: build
    if: github.ref == 'refs/heads/beta' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Meeqat-preview-${{ needs.build.outputs.version_name }}-build${{ github.run_number }}
          path: ./dist

      - name: Prepare preview metadata
        id: meta
        run: |
          ls -lh ./dist/** || ls -lh ./dist/
          APK=$(find ./dist -name "*.apk" | head -n1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Delete older beta prereleases (keep only latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "Cleaning up older beta-preview releases (keeping tag beta-latest)..."
          gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == true) | .tagName' | while read -r tag; do
            if [[ "$tag" == beta-preview-* ]]; then
              echo "→ Deleting old preview tag $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done
          echo "Pruning old beta workflow runs (keep 3)..."
          gh run list --branch beta --limit 100 --json databaseId,status --jq '.[] | select(.status == "completed") | .databaseId' | tail -n +4 | while read -r runId; do
            echo "→ Deleting run $runId"
            gh run delete "$runId" || true
          done || true

      - name: Clear old assets from rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in $(gh release view beta-latest --json assets --jq '.assets[].name' 2>/dev/null || true); do
            echo "→ Removing old asset $a"
            gh release delete-asset beta-latest "$a" --yes || true
          done

      - name: Create / update rolling preview release (beta-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-latest
          name: "Meeqat ${{ needs.build.outputs.version_name }}"
          prerelease: true
          generate_release_notes: true
          make_latest: false
          files: |
            ./dist/Meeqat-*.apk
            ./dist/Meeqat-*.apk.sha256
          body: |
            ### Meeqat — Beta Preview

            > ⚡ **Rolling preview** — this release is **overwritten on every push to `beta`**.
            > The previous preview APK is automatically deleted when a new commit lands.

            **Branch:** `beta` @ `${{ github.sha }}`
            **Version:** `${{ needs.build.outputs.version_name }}` · **Build:** `#${{ github.run_number }}`
            **Commit:** `${{ github.event.head_commit.message }}`

            #### Install
            1. Download `Meeqat-*.apk` below
            2. Allow “Install unknown apps” if prompted
            3. Install — it is signed with the preview keystore

            #### Changes in this preview
            ${{ github.event.head_commit.message }}

            ---
            *Artifact retention: 7 days · Old previews are pruned automatically.*

      - name: Comment preview link on associated PR (if any)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --head beta --state open --json number --jq '.[0].number' || true)
          if [[ -n "$PR" && "$PR" != "null" ]]; then
            gh pr comment "$PR" --body "### ✅ Preview APK ready
          **Version:** \`${{ needs.build.outputs.version_name }}\` · **Build:** \`#${{ github.run_number }}\`
          Download from the [beta-latest prerelease](https://github.com/${{ github.repository }}/releases/tag/beta-latest) — this link always points to the newest beta build (old previews are auto-deleted)."
          fi || true

  github-release:
    name: Publish release (main)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Meeqat-release-${{ needs.build.outputs.version_name }}
          path: ./dist

      - name: Gather metadata for notes
        id: meta
        run: |
          ls -lh ./dist/** || ls -lh ./dist/
          APK=$(find ./dist -name "*.apk" | head -n1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          if [[ -f "$APK.sha256" ]]; then
            SHA=$(cat "$APK.sha256")
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          else
            SHA=$(sha256sum "$APK")
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          fi
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous tag: $PREV_TAG"
          if [[ -n "$PREV_TAG" ]]; then
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:'- %h %s (%an) — %ad' --date=short)
          else
            LOG=$(git log --pretty=format:'- %h %s (%an) — %ad' --date=short -n 30)
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          SIZE=$(du -h "$APK" | cut -f1)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Generate full release notes
        id: notes
        run: |
          TITLE="Meeqat ${{ needs.build.outputs.display_version }}${{ needs.build.outputs.title_suffix }}"
          if [[ -n "$RELEASE_TAGLINE" ]]; then TITLE="$TITLE — $RELEASE_TAGLINE"; fi
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "# $TITLE" > release_notes.md
          echo "" >> release_notes.md
          cat >> release_notes.md <<'EOF'
          A calm, precise, and beautiful Azan app — crafted for accuracy, serenity, and personalization. Built with Material 3 Expressive.
          EOF
          if [[ -n "${{ needs.build.outputs.title_suffix }}" ]]; then
            echo "This is the first stable release. Thank you for being here at the start." >> release_notes.md
            echo "" >> release_notes.md
          fi
          cat >> release_notes.md <<'EOF'
          > [!WARNING]
          > Coming from a beta build? **Uninstall the beta first.** Beta builds carry
          > higher version codes, and Android refuses to install over them with a
          > lower one.

          ## 📦 Build info
          | Field | Value |
          |-------|-------|
          | **Version** | `${{ needs.build.outputs.display_version }}` |
          | **Version code** | `${{ needs.build.outputs.version_code }}` |
          | **Release date** | `${{ steps.meta.outputs.date }}` |
          | **Branch** | `main` @ `${{ github.sha }}` |
          | **APK size** | `${{ steps.meta.outputs.size }}` (per ABI) |
          | **SHA-256** | `${{ steps.meta.outputs.sha }}` |

          ## ✨ What's in Meeqat ${{ needs.build.outputs.version_name }}
          - **M3 Expressive serene surfaces**: Deep Emerald `#0D2C2A` seed, Warm Sand & Gold accents, tonal `surfaceContainerHigh` cards, `extraLarge 28dp` hero, `LinearWavyProgressIndicator` and `MotionScheme.expressive()` springs
          - **GPS-precise prayer engine**: `FusedLocationProviderClient` (8s timeout) + `com.batoulapps:adhan` local calculation (UmmAlQura default, all major methods, Shafi'i/Hanafi, high-lat rules), 30-day Room cache, `MidnightWorker` refresh, offline fallback
          - **User is the authority**: per-prayer manual adjustment `±60 min` via M3 Slider + `+/-` buttons + live `AssistChip` preview, kept separate from raw times; global +2 min safety toggle
          - **Local Azan sounds**: `OpenDocument audio/*` + `takePersistableUriPermission()` per-prayer (`SoundConfig`), 6–8 built-in Azans (Makkah/Madinah/Al-Aqsa), SAF revoke banner + `azan_cache` fallback
          - **Respectful Azan**: `AlarmManager.setExactAndAllowWhileIdle` + `ForegroundService` `USAGE_ALARM` + `FullScreenIntent` (Dismiss/Snooze 5m), DND-aware, `BOOT_COMPLETED`/`TIMEZONE_CHANGED` reschedule, battery-opt watchdog
          - **Qibla**: `TYPE_ROTATION_VECTOR` sensor fusion + `LowPassFilter`, 24-tick Canvas compass, Kaaba bearing/distance, figure-8 calibration
          - **Calendar & Hijri**: Gregorian ↔ Umm Al-Qura Hijri via `ummalqura-calendar`, monthly grid with daily times
          - **Navigation & Layout**: `NavigationSuiteScaffold` (Bar/Rail/Drawer) adaptive, `WindowSizeClass`, edge-to-edge `WindowInsets`, max width `840dp`, foldable hinge avoidance
          - **Settings**: Location (GPS/Manual/Cached pills), Calculation Method, Adjustments, Sound, Notifications (`AzanMode` per prayer), Appearance (dynamic color on Android 12+)
          EOF
          if [[ -f changelogs.md ]]; then
            echo "" >> release_notes.md
            sed -n '/## \[1.0.0/,/## \[/p' changelogs.md | head -n -1 >> release_notes.md
            echo "" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "## 📝 Git history" >> release_notes.md
          echo "" >> release_notes.md
          if [[ -n "${{ steps.meta.outputs.prev_tag }}" ]]; then
            echo "_Changes since \`${{ steps.meta.outputs.prev_tag }}\`:_" >> release_notes.md
          else
            echo "_Recent commits (no previous tag found):_" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "${{ steps.meta.outputs.changelog }}" >> release_notes.md
          echo "" >> release_notes.md
          cat >> release_notes.md <<'EOF'

          ## 📲 Install

          1. Download `Meeqat-*.apk` below
          2. On Android 13+ allow **Install unknown apps** for your browser/file manager
          3. Tap the APK to install (signed release — updates install over previous Meeqat builds)

          > Previous beta previews (`beta-latest`) remain prereleases and are **not** marked as `latest`.

          ## 🔒 Signing

          Release APKs are signed with the repository's release keystore (`secrets.KEYSTORE_BASE64`).
          If no secret is configured, CI generates an ephemeral keystore and notes it here — for production, add your real keystore as a secret.

          ## 🙏 Thank you

          Thanks for trying Meeqat! File issues & feature requests on the **Issues** tab.

          ---
          *This release was auto-generated by `build.yaml` on push to `main`.*
          EOF
          cat release_notes.md
          echo "notes_path=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: "${{ steps.notes.outputs.title }}"
          body_path: ${{ steps.notes.outputs.notes_path }}
          generate_release_notes: true
          make_latest: true
          prerelease: false
          files: |
            ./dist/Meeqat-*.apk
            ./dist/Meeqat-*.apk.sha256
          fail_on_unmatched_files: false

      - name: Mark previous beta prerelease as outdated (optional)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Main release ${{ needs.build.outputs.release_tag }} is now latest."
          gh release view ${{ needs.build.outputs.release_tag }} --json tagName,name,isLatest | cat || true
